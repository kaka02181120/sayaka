<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>POST Test</title>
</head>
<body>
  <div id="log" style="white-space:pre-wrap; font-family:monospace; background:#111; color:#fff; padding:12px;"></div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw76uZdz2NAVSjMs-N5Oy2xly6knsfIr77Q6ZQYTQ0-OmP54vYc9BE2twCXVrStaoC6Og/exec';

    function log(msg, obj) {
      const box = document.getElementById('log');
      const text = '[' + new Date().toLocaleTimeString('ja-JP') + '] ' + msg + ' ' + JSON.stringify(obj, null, 2);
      box.textContent += '\n' + text;
    }

    async function testPost() {
      log('POST START', { url: GAS_URL });

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          credentials: 'omit',
          cache: 'no-store',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            action: 'ping',
            data: { source: 'plain-post-test', ok: true }
          })
        });

        const text = await res.text();
        log('POST RESULT', {
          status: res.status,
          ok: res.ok,
          body: text
        });
      } catch (error) {
        log('POST FAIL', {
          message: error && error.message ? error.message : String(error)
        });
      }
    }

    window.addEventListener('DOMContentLoaded', function () {
      testPost();
    });
  </script>
</body>
</html>
